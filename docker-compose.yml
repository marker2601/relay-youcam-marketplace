name: relay

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay_local
    ports:
      - "54329:5432"
    volumes:
      - relay-postgres:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/001-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: relay_local
      MINIO_ROOT_PASSWORD: relay_local_secret
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - relay-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set relay http://minio:9000 relay_local relay_local_secret;
      mc mb --ignore-existing relay/relay-media;
      mc anonymous set none relay/relay-media;
      "
    restart: "no"

volumes:
  relay-postgres:
  relay-minio:

networks:
  default:
    ipam:
      config:
        - subnet: 10.253.0.0/24
